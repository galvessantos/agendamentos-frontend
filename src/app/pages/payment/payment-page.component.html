<div class="min-h-screen bg-gray-50">
  <!-- Navigation Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <span class="text-xl font-bold text-gray-900">AgendaAí</span>
      </a>

      <div class="flex items-center gap-4">
        <a routerLink="/planos" class="text-sm text-gray-600 hover:text-primary-600">Voltar</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    @if (selectedPlan) {
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Finalizar Assinatura</h1>
          <p class="text-gray-600">Plano selecionado: <span class="font-semibold text-primary-600">{{ planName }}</span></p>
        </div>

        <!-- Resumo do Plano -->
        <div class="bg-primary-50 rounded-lg p-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <span class="text-lg font-semibold text-gray-900">{{ planName }}</span>
            <span class="text-2xl font-bold text-primary-600">R$ {{ planPrice }}</span>
          </div>
          <p class="text-sm text-gray-600">/mês</p>
        </div>

        <!-- Formulário de Pagamento -->
        <form class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nome no cartão</label>
            <input
              type="text"
              placeholder="João Silva"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:outline-none"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Número do cartão</label>
            <input
              type="text"
              placeholder="1234 5678 9012 3456"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:outline-none"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Validade</label>
              <input
                type="text"
                placeholder="MM/AA"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:outline-none"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">CVV</label>
              <input
                type="text"
                placeholder="123"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:outline-none"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">CPF/CNPJ</label>
            <input
              type="text"
              placeholder="000.000.000-00"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:outline-none"
            />
          </div>

          <button
            type="button"
            (click)="processPayment()"
            class="w-full px-6 py-4 bg-primary-600 text-white rounded-lg font-semibold text-lg hover:bg-primary-700 transition-colors"
          >
            Finalizar Pagamento
          </button>

          <p class="text-xs text-center text-gray-500">
            Ao finalizar, você concorda com nossos termos de serviço e política de privacidade.
          </p>
        </form>
      </div>
    } @else {
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 text-center">
        <p class="text-gray-600 mb-4">Nenhum plano selecionado.</p>
        <a routerLink="/planos" class="text-primary-600 hover:text-primary-700 font-medium">
          Escolher um plano
        </a>
      </div>
    }
  </main>
</div>
